name: CI

# Follows the doctrine in skills/test-strategy: one non-blocking Linux job per pull-request update,
# and the Windows and macOS runs only on demand, weekly and on release tags. Nothing runs on a plain push.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'skills/**'
      - 'references/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    tags: ['v*']

permissions:
  contents: read

# Retain the production-threshold stress workload off the ordinary PR path.
# Bounded real-native restart tests run on every candidate.
env:
  AGENT_TESTS_STRESS: ${{ github.event_name != 'pull_request' && '1' || '0' }}

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/fixtures/mutation-native/package-lock.json
      - run: npm ci
      # Exact dev-only native adapters; never install these in managed runtime setup.
      # Pure Playwright assertion fixtures request no browser or page.
      - run: npm ci --prefix tests/fixtures/mutation-native
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run typecheck

  os-matrix:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/fixtures/mutation-native/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tests/fixtures/mutation-native
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run typecheck
