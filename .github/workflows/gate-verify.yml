# Throwaway gate verification for the Python parser dependency. Removed before merge.
name: gate-verify
on:
  push:
    branches: [feat/python-pytest-adapter]
jobs:
  managed-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: managed install, check and capabilities
        shell: bash
        run: |
          export AGENT_TESTS_HOME="$RUNNER_TEMP/agent-tests-home"
          node --version && npm --version
          node scripts/setup.js
          node scripts/setup.js --check --json
          node scripts/run-managed.js capabilities
          node scripts/run-managed.js scan --root tests/fixtures/python-mixed > "$RUNNER_TEMP/scan.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/scan.json','utf8')); const py=r.inventory.languages.find(l=>l.language==='Python'); console.log('python', JSON.stringify(py), 'files', r.files.length); if(!py||py.status!=='supported'||r.files.length<5) process.exit(1)"
          node scripts/run-managed.js report --root tests/fixtures/python-mixed | head -12
